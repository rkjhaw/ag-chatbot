<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chatbot-container">
    <div class="chat-icon" id="chatIcon">💬</div>
    <div class="chat-window" id="chatWindow">
      <div class="chat-header">🤖 Chat with us</div>
      class="chat-body" id="chatBody">
        <div class="message bot">Hi there! What can I help you with today?</div>
        <div class="menu-options">
          <button onclick="selectOption('cement')">Cement</button>
          <button onclick="selectOption('other')">Other</button>
        </div>
      </div>
      <div class="chat-input" id="chatInput"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
